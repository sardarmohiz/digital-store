<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard - Digital Store</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

</head>

<body>

  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="admin-header">

    <div>

      <h1>
        Digital Store Admin
      </h1>

      <p>
        Manage your products and payments
      </p>

    </div>


    <button
      id="logoutBtn"
      type="button"
    >
      Logout
    </button>

  </header>


  <main class="admin-container">


    <!-- =========================================
         LOGIN
    ========================================== -->

    <section
      id="loginSection"
      class="admin-card"
    >

      <h2>
        Admin Login
      </h2>


      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Admin Email"
          required
        >


        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >


        <button type="submit">
          Login
        </button>

      </form>


      <p id="loginMessage"></p>

    </section>



    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <section
      id="dashboardSection"
      style="display:none;"
    >


      <!-- =====================================
           PAYMENT SETTINGS
      ====================================== -->

      <div class="admin-card">

        <h2>
          💳 Payment Settings
        </h2>

        <p>
          Enter the payment details that customers
          will see during checkout.
        </p>


        <form id="paymentSettingsForm">


          <label>
            Easypaisa Number
          </label>

          <input
            type="text"
            id="easypaisaNumber"
            placeholder="03XXXXXXXXX"
          >


          <label>
            JazzCash Number
          </label>

          <input
            type="text"
            id="jazzcashNumber"
            placeholder="03XXXXXXXXX"
          >


          <label>
            Account Name
          </label>

          <input
            type="text"
            id="paymentAccountName"
            placeholder="Your Name"
          >


          <label>
            Payment Instructions
          </label>

          <textarea
            id="paymentInstructions"
            rows="5"
            placeholder="Send the exact product amount to the above number and keep your transaction ID."
          ></textarea>


          <button
            type="submit"
            id="savePaymentSettings"
          >
            Save Payment Settings
          </button>


          <p id="paymentSettingsMessage"></p>

        </form>

      </div>



      <!-- =====================================
           ADD PRODUCT
      ====================================== -->

      <div class="admin-card">

        <h2>
          Add New Product
        </h2>


        <form id="productForm">


          <input
            type="text"
            id="productTitle"
            placeholder="Product title"
            required
          >


          <textarea
            id="productDescription"
            placeholder="Product description"
            rows="5"
            required
          ></textarea>


          <input
            type="number"
            id="productPrice"
            placeholder="Price"
            min="0"
            step="0.01"
            required
          >


          <input
            type="text"
            id="productCategory"
            placeholder="Category"
          >


          <label>
            Product Image
          </label>


          <input
            type="file"
            id="productImage"
            accept="image/*"
            required
          >


          <label>
            Digital Product File
          </label>


          <input
            type="file"
            id="productFile"
            required
          >


          <label class="checkbox-row">

            <input
              type="checkbox"
              id="featuredProduct"
            >

            Featured Product

          </label>


          <button type="submit">
            Add Product
          </button>

        </form>


        <p id="productMessage"></p>

      </div>



      <!-- =====================================
           PRODUCTS
      ====================================== -->

      <div class="admin-card">

        <div class="admin-products-header">

          <h2>
            My Products
          </h2>


          <button
            type="button"
            id="refreshProducts"
          >
            Refresh
          </button>

        </div>


        <div id="adminProducts">

          <p>
            Loading products...
          </p>

        </div>

      </div>


    </section>

  </main>



  <!-- =========================================
       EXISTING ADMIN JS
  ========================================== -->

  <script src="admin.js"></script>



  <!-- =========================================
       PAYMENT SETTINGS JS
  ========================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadPaymentSettings();


        const form =
          document.getElementById(
            "paymentSettingsForm"
          );


        if (!form) {
          return;
        }


        form.addEventListener(
          "submit",
          savePaymentSettings
        );

      }
    );



    // ==========================================
    // LOAD PAYMENT SETTINGS
    // ==========================================

    async function loadPaymentSettings() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("payment_settings")
            .select("*")
            .eq("id", 1)
            .maybeSingle();


        if (error) {
          throw error;
        }


        if (!data) {
          return;
        }


        document.getElementById(
          "easypaisaNumber"
        ).value =
          data.easypaisa_number || "";


        document.getElementById(
          "jazzcashNumber"
        ).value =
          data.jazzcash_number || "";


        document.getElementById(
          "paymentAccountName"
        ).value =
          data.account_name || "";


        document.getElementById(
          "paymentInstructions"
        ).value =
          data.instructions || "";


      } catch (error) {

        console.error(
          "Payment settings loading error:",
          error
        );

      }

    }



    // ==========================================
    // SAVE PAYMENT SETTINGS
    // ==========================================

    async function savePaymentSettings(event) {

      event.preventDefault();


      const button =
        document.getElementById(
          "savePaymentSettings"
        );


      const message =
        document.getElementById(
          "paymentSettingsMessage"
        );


      const easypaisa =
        document.getElementById(
          "easypaisaNumber"
        ).value.trim();


      const jazzcash =
        document.getElementById(
          "jazzcashNumber"
        ).value.trim();


      const accountName =
        document.getElementById(
          "paymentAccountName"
        ).value.trim();


      const instructions =
        document.getElementById(
          "paymentInstructions"
        ).value.trim();


      button.disabled = true;

      button.textContent =
        "Saving...";


      message.textContent = "";


      try {

        const {
          data: existing,
          error: findError
        } =
          await supabaseClient
            .from("payment_settings")
            .select("id")
            .eq("id", 1)
            .maybeSingle();


        if (findError) {
          throw findError;
        }


        let result;


        if (existing) {

          result =
            await supabaseClient
              .from("payment_settings")
              .update({

                easypaisa_number:
                  easypaisa,

                jazzcash_number:
                  jazzcash,

                account_name:
                  accountName,

                instructions:
                  instructions,

                updated_at:
                  new Date().toISOString()

              })
              .eq("id", 1);

        } else {

          result =
            await supabaseClient
              .from("payment_settings")
              .insert({

                id: 1,

                easypaisa_number:
                  easypaisa,

                jazzcash_number:
                  jazzcash,

                account_name:
                  accountName,

                instructions:
                  instructions

              });

        }


        if (result.error) {
          throw result.error;
        }


        message.textContent =
          "✅ Payment settings saved successfully!";


        button.textContent =
          "Saved ✓";


        setTimeout(
          function () {

            button.textContent =
              "Save Payment Settings";

          },
          2000
        );


      } catch (error) {

        console.error(error);


        message.textContent =
          "❌ " +
          error.message;


        button.textContent =
          "Save Payment Settings";


      } finally {

        button.disabled = false;

      }

    }

  </script>

</body>
</html>
