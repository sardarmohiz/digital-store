<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Digital Store</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <header class="admin-header">
    <div>
      <h1>Digital Store Admin</h1>
      <p>Manage your products</p>
    </div>

    <button id="logoutBtn" type="button">
      Logout
    </button>
  </header>


  <main class="admin-container">

    <!-- LOGIN -->

    <section id="loginSection" class="admin-card">

      <h2>Admin Login</h2>

      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Admin Email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <p id="loginMessage"></p>

    </section>


    <!-- DASHBOARD -->

    <section id="dashboardSection" style="display:none;">

      <div class="admin-card">

        <h2>Add New Product</h2>

        <form id="productForm">

          <input
            type="text"
            id="productTitle"
            placeholder="Product title"
            required
          >

          <textarea
            id="productDescription"
            placeholder="Product description"
            rows="5"
            required
          ></textarea>

          <input
            type="number"
            id="productPrice"
            placeholder="Price"
            min="0"
            step="0.01"
            required
          >

          <input
            type="text"
            id="productCategory"
            placeholder="Category"
          >

          <label>
            Product Image
          </label>

          <input
            type="file"
            id="productImage"
            accept="image/*"
          >

          <label>
            Digital Product File
          </label>

          <input
            type="file"
            id="productFile"
            required
          >

          <label class="checkbox-row">

            <input
              type="checkbox"
              id="featuredProduct"
            >

            Featured Product

          </label>

          <button type="submit">
            Add Product
          </button>

        </form>

        <p id="productMessage"></p>

      </div>


      <!-- PRODUCTS -->

      <div class="admin-card">

        <div class="admin-products-header">

          <h2>My Products</h2>

          <button
            type="button"
            id="refreshProducts"
          >
            Refresh
          </button>

        </div>

        <div id="adminProducts">

          <p>Loading products...</p>

        </div>

      </div>

    </section>

  </main>


  <script src="admin.js"></script>

</body>
</html>
