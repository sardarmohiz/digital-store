<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Order Received - Digital Store</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="config.js"></script>

</head>


<body>

  <!-- HEADER -->

  <header class="store-header">

    <div class="store-logo">
      Digital Store
    </div>

    <a href="./index.html">
      Home
    </a>

  </header>



  <!-- MAIN -->

  <main
    style="
      max-width:800px;
      margin:50px auto;
      padding:20px;
    "
  >


    <!-- LOADING -->

    <div
      id="loading"
      style="
        text-align:center;
        padding:60px 20px;
      "
    >

      Loading your order...

    </div>



    <!-- ORDER -->

    <div
      id="orderBox"
      style="display:none;"
    >

      <div
        style="
          padding:30px;
          border:1px solid #ddd;
          border-radius:18px;
        "
      >


        <h1>
          ✅ Order Received
        </h1>


        <p>
          Thank you for your order.
        </p>


        <p>

          Order ID:

          <strong id="orderId">
            -
          </strong>

        </p>



        <!-- PRODUCT -->

        <div
          style="
            display:flex;
            gap:20px;
            align-items:center;
            flex-wrap:wrap;
            margin:30px 0;
          "
        >


          <img
            id="productImage"
            src=""
            alt="Product"
            style="
              width:200px;
              height:140px;
              object-fit:cover;
              border-radius:12px;
            "
          >


          <div>

            <h2 id="productTitle">
              Product
            </h2>


            <p>
              Price:
              <strong id="productPrice">
                $0.00
              </strong>
            </p>

          </div>


        </div>



        <!-- DOWNLOAD -->

        <div
          style="
            padding:25px;
            background:#f0fdf4;
            border-radius:14px;
            text-align:center;
          "
        >

          <h2>
            📚 Your Digital Product
          </h2>


          <p>
            Your product is ready.
          </p>


          <button
            id="downloadButton"
            type="button"
            style="
              padding:15px 30px;
              font-size:16px;
              cursor:pointer;
              border:none;
              border-radius:10px;
            "
          >

            📥 Download Book

          </button>


        </div>



        <br>


        <a href="./index.html">
          ← Back to Store
        </a>


      </div>

    </div>



    <!-- ERROR -->

    <div
      id="errorBox"
      style="
        display:none;
        text-align:center;
        padding:60px 20px;
      "
    >

      <h2>
        ❌ Order Not Found
      </h2>


      <p id="errorMessage">
        We could not find your order.
      </p>


      <a href="./index.html">
        ← Back to Store
      </a>

    </div>


  </main>



  <script>


    // =====================================
    // LOAD ORDER
    // =====================================

    async function loadOrder() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      const orderId =
        params.get("id");


      if (!orderId) {

        showError(
          "Order ID is missing."
        );

        return;

      }



      try {


        // =================================
        // GET ORDER
        // =================================

        const {
          data: order,
          error: orderError
        } =
          await supabaseClient
            .from("orders")
            .select("*")
            .eq(
              "order_id",
              orderId
            )
            .single();


        if (orderError) {

          throw orderError;

        }


        if (!order) {

          showError(
            "Order not found."
          );

          return;

        }



        // =================================
        // ORDER ID
        // =================================

        document.getElementById(
          "orderId"
        ).textContent =
          order.order_id;



        // =================================
        // GET PRODUCT
        // =================================

        const {
          data: product,
          error: productError
        } =
          await supabaseClient
            .from("products")
            .select("*")
            .eq(
              "id",
              order.product_id
            )
            .single();


        if (productError) {

          throw productError;

        }


        if (!product) {

          showError(
            "Product not found."
          );

          return;

        }



        // =================================
        // PRODUCT INFO
        // =================================

        document.getElementById(
          "productTitle"
        ).textContent =
          product.title;


        document.getElementById(
          "productPrice"
        ).textContent =
          "$" +
          Number(
            product.price || 0
          ).toFixed(2);


        const image =
          document.getElementById(
            "productImage"
          );


        image.src =
          product.image_url ||
          "https://via.placeholder.com/600x400?text=Product";


        image.alt =
          product.title;



        // =================================
        // DOWNLOAD BUTTON
        // =================================

        const downloadButton =
          document.getElementById(
            "downloadButton"
          );


        downloadButton.onclick =
          function () {


            if (
              !product.file_url
            ) {

              alert(
                "Download file is not available."
              );

              return;

            }


            window.open(
              product.file_url,
              "_blank"
            );

          };



        // =================================
        // SHOW ORDER
        // =================================

        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "orderBox"
        ).style.display =
          "block";


      } catch (error) {


        console.error(
          "Order error:",
          error
        );


        showError(
          error.message
        );

      }

    }



    // =====================================
    // ERROR
    // =====================================

    function showError(
      message
    ) {


      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "orderBox"
      ).style.display =
        "none";


      document.getElementById(
        "errorBox"
      ).style.display =
        "block";


      document.getElementById(
        "errorMessage"
      ).textContent =
        message ||
        "Order not found.";

    }



    // =====================================
    // START
    // =====================================

    loadOrder();

  </script>


</body>

</html>
