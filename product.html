<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product - Digital Store</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="config.js"></script>

</head>


<body>

  <!-- ================================
       HEADER
  ================================= -->

  <header class="store-header">

    <div class="store-logo">
      Digital Store
    </div>

    <a href="./index.html">
      Home
    </a>

  </header>



  <!-- ================================
       MAIN
  ================================= -->

  <main class="product-page">


    <!-- LOADING -->

    <div
      id="loading"
      style="
        text-align:center;
        padding:60px 20px;
      "
    >

      Loading product...

    </div>



    <!-- PRODUCT -->

    <div
      id="product"
      style="display:none;"
    >

      <div class="product-detail">


        <!-- IMAGE -->

        <div class="product-detail-image">

          <img
            id="image"
            src=""
            alt="Product"
            style="
              width:100%;
              max-width:600px;
              border-radius:15px;
              display:block;
            "
          >

        </div>



        <!-- INFORMATION -->

        <div class="product-detail-info">


          <div
            id="category"
            class="product-category"
          ></div>


          <h1 id="title">
            Product
          </h1>


          <p
            id="description"
            class="product-description"
          ></p>


          <div
            id="price"
            class="product-price"
          >
            $0.00
          </div>



          <!-- BUY BUTTON -->

          <button
            id="buyButton"
            class="buy-button"
            type="button"
          >
            Buy Now
          </button>


          <p>
            🔒 Secure digital delivery
          </p>


        </div>

      </div>

    </div>



    <!-- ERROR -->

    <div
      id="error"
      style="
        display:none;
        text-align:center;
        padding:60px 20px;
      "
    >

      <h2>
        Product not found
      </h2>

      <p id="errorMessage">
        This product is unavailable.
      </p>

      <a href="./index.html">
        ← Back to Store
      </a>

    </div>


  </main>



  <!-- ================================
       JAVASCRIPT
  ================================= -->

  <script>

    // =================================
    // LOAD PRODUCT
    // =================================

    async function loadProduct() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const id =
        params.get("id");


      if (!id) {

        showError(
          "Product ID is missing."
        );

        return;

      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select("*")
            .eq("id", id)
            .eq("published", true)
            .single();


        if (error) {

          throw error;

        }


        if (!data) {

          showError(
            "Product not found."
          );

          return;

        }


        // =============================
        // PRODUCT DATA
        // =============================

        document.title =
          data.title +
          " - Digital Store";


        const image =
          document.getElementById(
            "image"
          );


        image.src =
          data.image_url ||
          "https://via.placeholder.com/600x400?text=Product";


        image.alt =
          data.title || "Product";


        image.onerror =
          function () {

            this.src =
              "https://via.placeholder.com/600x400?text=Image+Error";

          };


        document.getElementById(
          "title"
        ).textContent =
          data.title || "Product";


        document.getElementById(
          "description"
        ).textContent =
          data.description || "";


        document.getElementById(
          "category"
        ).textContent =
          data.category ||
          "Digital Product";


        document.getElementById(
          "price"
        ).textContent =
          "$" +
          Number(
            data.price || 0
          ).toFixed(2);



        // =============================
        // BUY NOW
        // =============================

        const buyButton =
          document.getElementById(
            "buyButton"
          );


        buyButton.onclick =
          function () {

            // DIRECT CHECKOUT URL

            const checkoutUrl =
              "./checkout.html?id=" +
              encodeURIComponent(
                data.id
              );


            window.location.href =
              checkoutUrl;

          };


        // =============================
        // SHOW PRODUCT
        // =============================

        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "product"
        ).style.display =
          "block";


      } catch (error) {

        console.error(
          "Product loading error:",
          error
        );


        showError(
          error.message
        );

      }

    }



    // =================================
    // SHOW ERROR
    // =================================

    function showError(
      message
    ) {

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "product"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";


      document.getElementById(
        "errorMessage"
      ).textContent =
        message ||
        "Product not found.";

    }



    // =================================
    // START
    // =================================

    loadProduct();

  </script>


</body>

</html>
