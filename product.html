<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product - Digital Store</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>
</head>

<body>

  <header class="store-header">

    <div class="store-logo">
      Digital Store
    </div>

    <a href="index.html">
      Home
    </a>

  </header>


  <main class="product-page">

    <div
      id="loading"
      style="
        text-align:center;
        padding:60px 20px;
      "
    >
      Loading product...
    </div>


    <div
      id="product"
      style="display:none;"
    >

      <div class="product-detail">

        <div class="product-detail-image">

          <img
            id="image"
            src=""
            alt="Product"
            style="
              width:100%;
              max-width:600px;
              border-radius:15px;
              display:block;
            "
          >

        </div>


        <div class="product-detail-info">

          <div
            id="category"
            class="product-category"
          ></div>


          <h1 id="title">
            Product
          </h1>


          <p
            id="description"
            class="product-description"
          ></p>


          <div
            id="price"
            class="product-price"
          >
            $0.00
          </div>


          <button
            id="buyButton"
            class="buy-button"
            type="button"
          >
            Buy Now
          </button>


          <p>
            🔒 Secure digital delivery
          </p>

        </div>

      </div>

    </div>


    <div
      id="error"
      style="
        display:none;
        text-align:center;
        padding:60px 20px;
      "
    >

      <h2>
        Product not found
      </h2>

      <p>
        This product is unavailable.
      </p>

      <a href="index.html">
        ← Back to Store
      </a>

    </div>

  </main>


  <script>

    async function loadProduct() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const id =
        params.get("id");


      if (!id) {

        showError();

        return;
      }


      try {

        const {
          data,
          error
        } = await supabaseClient
          .from("products")
          .select("*")
          .eq("id", id)
          .eq("published", true)
          .single();


        if (error) {
          throw error;
        }


        if (!data) {

          showError();

          return;
        }


        document.title =
          data.title +
          " - Digital Store";


        document.getElementById(
          "image"
        ).src =
          data.image_url ||
          "https://via.placeholder.com/600x400?text=Product";


        document.getElementById(
          "image"
        ).alt =
          data.title;


        document.getElementById(
          "title"
        ).textContent =
          data.title;


        document.getElementById(
          "description"
        ).textContent =
          data.description || "";


        document.getElementById(
          "category"
        ).textContent =
          data.category ||
          "Digital Product";


        document.getElementById(
          "price"
        ).textContent =
          "$" +
          Number(
            data.price || 0
          ).toFixed(2);


        document.getElementById(
          "buyButton"
        ).onclick = function() {

          alert(
            "Payment system will be connected next."
          );

        };


        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "product"
        ).style.display =
          "block";


      } catch (error) {

        console.error(
          "Product error:",
          error
        );

        showError();

      }

    }


    function showError() {

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "product"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";

    }


    loadProduct();

  </script>

</body>
</html>
