<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout - Digital Store</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="config.js"></script>

</head>


<body>

  <header class="store-header">

    <div class="store-logo">
      Digital Store
    </div>

    <a href="index.html">
      Home
    </a>

  </header>



  <main
    style="
      max-width:700px;
      margin:40px auto;
      padding:20px;
    "
  >


    <!-- LOADING -->

    <div
      id="loading"
      style="
        text-align:center;
        padding:50px;
      "
    >

      Loading checkout...

    </div>



    <!-- CHECKOUT -->

    <div
      id="checkout"
      style="display:none;"
    >

      <div
        style="
          border:1px solid #ddd;
          border-radius:18px;
          padding:25px;
        "
      >

        <h1>
          Checkout
        </h1>


        <!-- PRODUCT -->

        <div
          style="
            display:flex;
            gap:15px;
            align-items:center;
            margin:20px 0;
          "
        >

          <img
            id="productImage"
            src=""
            alt="Product"
            style="
              width:140px;
              height:100px;
              object-fit:cover;
              border-radius:10px;
            "
          >


          <div>

            <h2 id="productTitle">
              Product
            </h2>


            <strong id="productPrice">
              $0.00
            </strong>

          </div>

        </div>



        <hr>



        <!-- CUSTOMER -->

        <h2>
          Customer Information
        </h2>


        <input
          id="customerName"
          type="text"
          placeholder="Your Name"
          required
          style="
            width:100%;
            padding:12px;
            margin:8px 0;
            box-sizing:border-box;
          "
        >


        <input
          id="customerEmail"
          type="email"
          placeholder="Your Email"
          required
          style="
            width:100%;
            padding:12px;
            margin:8px 0;
            box-sizing:border-box;
          "
        >



        <h2>
          Payment
        </h2>


        <p>
          Send the exact amount to our Easypaisa/JazzCash account.
        </p>


        <div
          style="
            padding:15px;
            background:#f5f5f5;
            border-radius:10px;
            margin:15px 0;
          "
        >

          <strong>
            Easypaisa / JazzCash
          </strong>

          <br>

          <span>
            Your Payment Number
          </span>

          <br>

          <strong>
            Replace this number
          </strong>

        </div>



        <input
          id="transactionId"
          type="text"
          placeholder="Transaction ID"
          required
          style="
            width:100%;
            padding:12px;
            margin:8px 0;
            box-sizing:border-box;
          "
        >



        <button
          id="submitOrder"
          type="button"
          style="
            width:100%;
            padding:15px;
            margin-top:15px;
            cursor:pointer;
          "
        >

          I Have Paid — Submit Order

        </button>


        <p
          id="message"
          style="
            margin-top:15px;
          "
        ></p>


      </div>

    </div>



    <!-- ERROR -->

    <div
      id="error"
      style="
        display:none;
        text-align:center;
        padding:50px;
      "
    >

      <h2>
        Product Not Found
      </h2>

      <p id="errorMessage"></p>


      <a href="index.html">
        ← Back to Store
      </a>

    </div>


  </main>



  <script>


    let currentProduct = null;



    // =====================================
    // LOAD PRODUCT
    // =====================================

    async function loadProduct() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      const productId =
        params.get("id");


      if (!productId) {

        showError(
          "Product ID is missing."
        );

        return;

      }


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select("*")
            .eq(
              "id",
              productId
            )
            .eq(
              "published",
              true
            )
            .single();


        if (error) {

          throw error;

        }


        if (!data) {

          showError(
            "Product not found."
          );

          return;

        }


        currentProduct =
          data;



        document.getElementById(
          "productTitle"
        ).textContent =
          data.title;


        document.getElementById(
          "productPrice"
        ).textContent =
          "$" +
          Number(
            data.price || 0
          ).toFixed(2);


        document.getElementById(
          "productImage"
        ).src =
          data.image_url ||
          "https://via.placeholder.com/400x250?text=Product";



        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "checkout"
        ).style.display =
          "block";


      } catch (error) {


        console.error(
          error
        );


        showError(
          error.message
        );

      }

    }



    // =====================================
    // SUBMIT ORDER
    // =====================================

    document
      .getElementById(
        "submitOrder"
      )
      .addEventListener(
        "click",
        submitOrder
      );



    async function submitOrder() {


      const name =
        document
          .getElementById(
            "customerName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "customerEmail"
          )
          .value
          .trim();


      const transactionId =
        document
          .getElementById(
            "transactionId"
          )
          .value
          .trim();


      const message =
        document.getElementById(
          "message"
        );


      if (!name) {

        message.textContent =
          "Please enter your name.";

        return;

      }


      if (!email) {

        message.textContent =
          "Please enter your email.";

        return;

      }


      if (!transactionId) {

        message.textContent =
          "Please enter your Transaction ID.";

        return;

      }


      if (!currentProduct) {

        message.textContent =
          "Product information is missing.";

        return;

      }



      message.textContent =
        "Submitting order...";


      const orderId =
        "DS-" +
        Date.now();



      try {


        const {
          error
        } =
          await supabaseClient
            .from("orders")
            .insert({

              order_id:
                orderId,

              product_id:
                currentProduct.id,

              customer_name:
                name,

              customer_email:
                email,

              amount:
                Number(
                  currentProduct.price
                ),

              transaction_id:
                transactionId,

              payment_status:
                "pending",

              order_status:
                "pending",

              created_at:
                new Date()
                  .toISOString()

            });


        if (error) {

          throw error;

        }



        // =================================
        // SEND CUSTOMER TO ORDER PAGE
        // =================================

        window.location.href =
          "./order.html?id=" +
          encodeURIComponent(
            orderId
          );


      } catch (error) {


        console.error(
          error
        );


        message.textContent =
          "❌ " +
          error.message;

      }

    }



    // =====================================
    // ERROR
    // =====================================

    function showError(
      message
    ) {


      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "checkout"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";


      document.getElementById(
        "errorMessage"
      ).textContent =
        message;

    }



    // START

    loadProduct();

  </script>


</body>

</html>
